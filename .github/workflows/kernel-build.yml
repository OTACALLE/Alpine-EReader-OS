
name: Samsung J2 Core kernel build

on:
  workflow_dispatch:
    inputs:
      source_url:
        description: "Direct URL to the approved Samsung source ZIP"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: j260m-kernel-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-kernel:
    name: Verify and build Samsung J2 Core kernel
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            curl unzip git bc bison flex \
            build-essential libssl-dev libelf-dev \
            python3

      - name: Download and verify approved Samsung source
        env:
          SOURCE_URL: ${{ inputs.source_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-artifacts

          curl --fail --location --retry 3 \
            --output samsung-source.zip "$SOURCE_URL"

          echo "0059b115fc49d93c83319f8c3c11b21242e08475147ce96598d463fab53f7b36  samsung-source.zip" \
            | sha256sum --check

          mkdir -p source-archive kernel-source
          unzip -q samsung-source.zip -d source-archive

          archive="$(find source-archive -type f \
            -name 'Kernel.tar.gz' -print -quit)"
          test -n "$archive"
          tar -xzf "$archive" -C kernel-source

          config="$(find kernel-source -type f \
            -path '*/arch/arm64/configs/j2corelte_01_defconfig' \
            -print -quit)"
          test -n "$config"

          kernel_root="${config%/arch/arm64/configs/j2corelte_01_defconfig}"
          test -f "$kernel_root/Makefile"

          {
            echo "Commit: $GITHUB_SHA"
            echo "Source archive SHA-256:"
            sha256sum samsung-source.zip
            echo "Kernel root: $kernel_root"
            echo "Defconfig: $config"
          } | tee build-artifacts/source-verification.txt

          echo "KERNEL_ROOT=$kernel_root" >> "$GITHUB_ENV"

      - name: Install Android GCC 4.9
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            --branch android-8.1.0_r79 \
            https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git \
            android-gcc

          test -x android-gcc/bin/aarch64-linux-android-gcc

          android-gcc/bin/aarch64-linux-android-gcc --version \
            | tee build-artifacts/toolchain-version.txt

          echo "$GITHUB_WORKSPACE/android-gcc/bin" >> "$GITHUB_PATH"
          echo "CROSS_COMPILE=$GITHUB_WORKSPACE/android-gcc/bin/aarch64-linux-android-" >> "$GITHUB_ENV"

      - name: Fix legacy device-tree compiler
        shell: bash
        run: |
          set -euo pipefail

          lexer="$KERNEL_ROOT/scripts/dtc/dtc-lexer.l"
          test -f "$lexer"

          python3 - "$lexer" <<'PY'
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          text = path.read_text()
          declaration = "YYLTYPE yylloc;"
          count = text.count(declaration)

          if count > 1:
              raise SystemExit(
                  f"Multiple declarations found: {count}; refusing blind edit."
              )

          if count == 1:
              path.write_text(text.replace(declaration, "", 1))

          if declaration in path.read_text():
              raise SystemExit("Redundant yylloc declaration remains.")

          print("DTC lexer check completed.")
          PY

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail

          make -C "$KERNEL_ROOT" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            j2corelte_01_defconfig \
            2>&1 | tee build-artifacts/configure.log

      - name: Compile kernel image and device trees
        shell: bash
        run: |
          set -euo pipefail

          make -C "$KERNEL_ROOT" \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            -j2 Image dtbs \
            2>&1 | tee build-artifacts/build.log

          test -s "$KERNEL_ROOT/arch/arm64/boot/Image"

          cp "$KERNEL_ROOT/arch/arm64/boot/Image" \
            build-artifacts/Image

          find "$KERNEL_ROOT/arch/arm64/boot/dts" \
            -type f -name '*.dtb' \
            -exec cp --parents '{}' build-artifacts/ \;

          sha256sum build-artifacts/Image \
            | tee build-artifacts/kernel-image.sha256

      - name: Upload build logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samsung-j260m-kernel-build
          path: |
            build-artifacts/
            samsung-source.zip
          if-no-files-found: warn
          retention-days: 14
